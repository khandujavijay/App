<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <title>Hourbook | Daily bookings</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182b2b;
      --muted: #657572;
      --paper: #f4f2ec;
      --surface: #fffefa;
      --line: #dddcd3;
      --green: #176b53;
      --green-soft: #e4f1e9;
      --coral: #bf5746;
      --coral-soft: #f8e9e4;
      --gold: #e4bd65;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#d7d6cb 0.7px, transparent 0.7px);
      background-size: 18px 18px;
    }

    button, input { font: inherit; }

    .shell {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 11px;
      color: #fffefa;
      background: var(--green);
      font-size: 18px;
      font-weight: 800;
    }
    .brand-name { font-size: 17px; font-weight: 800; }
    .brand-caption { margin-top: 2px; color: var(--muted); font-size: 12px; }

    .timezone { color: var(--muted); font-size: 13px; }

    main { padding-top: 34px; }
    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 25px;
    }
    .eyebrow {
      margin: 0 0 9px;
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 5vw, 49px);
      font-weight: 500;
      line-height: 1.05;
    }
    .intro-copy { margin: 10px 0 0; color: var(--muted); font-size: 15px; }

    .date-control {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 0 0 auto;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }
    .date-control label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .date-control input {
      width: 148px;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 14px;
    }

    .overview {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 66px;
      margin-bottom: 15px;
      padding: 13px 17px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }
    .day-label { font-family: Georgia, "Times New Roman", serif; font-size: 18px; }
    .counts { display: flex; align-items: center; gap: 18px; color: var(--muted); font-size: 13px; }
    .count { display: inline-flex; align-items: center; gap: 7px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
    .dot.booked { background: var(--coral); }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
    }
    .slot {
      display: flex;
      min-height: 72px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 5px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--green);
      border-radius: 6px;
      color: var(--ink);
      background: var(--surface);
      text-align: left;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
    }
    .slot:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--green);
      background: var(--green-soft);
    }
    .slot:focus-visible, .date-control input:focus-visible, .booking-form input:focus-visible,
    .booking-form button:focus-visible, .dialog-close:focus-visible, .cancel-booking:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }
    .booked-slot {
      border-left-color: var(--coral);
      color: var(--muted);
      background: #f4f0eb;
      cursor: not-allowed;
    }
    .slot-time { font-size: 14px; font-weight: 800; }
    .slot-state { overflow: hidden; max-width: 100%; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .booked-slot .slot-state { color: var(--coral); }
    .cancel-booking {
      margin: 0;
      padding: 0;
      border: 0;
      color: #9c4033;
      background: transparent;
      font-size: 12px;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }
    .cancel-booking:hover { color: #70291f; }

    .note {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 17px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .note-mark { color: var(--green); font-weight: 900; }

    dialog {
      width: min(420px, calc(100% - 32px));
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 24px 80px #182b2b33;
    }
    dialog::backdrop { background: #182b2b80; backdrop-filter: blur(2px); }
    .dialog-content { padding: 24px; }
    .dialog-head { display: flex; justify-content: space-between; gap: 15px; }
    .dialog-head h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 25px; font-weight: 500; }
    .dialog-head p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .dialog-close {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: transparent;
      font-size: 20px;
      cursor: pointer;
    }
    .booking-form { display: grid; gap: 15px; margin-top: 23px; }
    .booking-form label { display: grid; gap: 7px; font-size: 12px; font-weight: 800; }
    .booking-form input {
      width: 100%;
      height: 43px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      font-size: 14px;
    }
    .booking-form button {
      height: 44px;
      border: 0;
      border-radius: 6px;
      color: white;
      background: var(--green);
      font-weight: 800;
      cursor: pointer;
    }
    .booking-form button:hover { background: #115640; }
    .error { min-height: 16px; margin: -7px 0 0; color: var(--coral); font-size: 12px; }

    @media (max-width: 760px) {
      .slot-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 28px, 440px); padding-top: 20px; }
      .intro { align-items: flex-start; flex-direction: column; gap: 17px; }
      .date-control { width: 100%; justify-content: space-between; }
      .date-control input { width: 154px; }
      .slot-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .slot { min-height: 67px; padding: 10px; }
      .overview { align-items: flex-start; flex-direction: column; gap: 9px; }
      .counts { gap: 14px; }
      .timezone { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">H</div>
        <div>
          <div class="brand-name">Hourbook</div>
          <div class="brand-caption">Simple hourly reservations</div>
        </div>
      </div>
      <div class="timezone" id="timezone"></div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Availability</p>
          <h1 id="page-title">Book your hour.</h1>
          <p class="intro-copy">Choose a day, then reserve an open time slot.</p>
        </div>
        <div class="date-control">
          <label for="booking-date">Booking date</label>
          <input id="booking-date" type="date">
        </div>
      </section>

      <section aria-label="Hourly availability">
        <div class="overview">
          <div class="day-label" id="day-label"></div>
          <div class="counts" aria-live="polite">
            <span class="count"><span class="dot" aria-hidden="true"></span><span id="available-count"></span></span>
            <span class="count"><span class="dot booked" aria-hidden="true"></span><span id="booked-count"></span></span>
          </div>
        </div>
        <div class="slot-grid" id="slot-grid" aria-live="polite"></div>
        <p class="note"><span class="note-mark" aria-hidden="true">i</span><span>Each reservation is one hour. Your bookings are saved in this browser and kept separate for each date.</span></p>
      </section>
    </main>
  </div>

  <dialog id="booking-dialog" aria-labelledby="dialog-title">
    <div class="dialog-content">
      <div class="dialog-head">
        <div>
          <h2 id="dialog-title">Reserve this hour</h2>
          <p id="dialog-slot"></p>
        </div>
        <button class="dialog-close" id="close-dialog" type="button" aria-label="Close">&times;</button>
      </div>
      <form class="booking-form" id="booking-form">
        <label for="guest-name">Your name
          <input id="guest-name" name="guest-name" type="text" maxlength="60" autocomplete="name" placeholder="e.g. Alex Morgan" required>
        </label>
        <p class="error" id="form-error" role="alert"></p>
        <button type="submit">Confirm booking</button>
      </form>
    </div>
  </dialog>

  <script>
    const dateInput = document.querySelector("#booking-date");
    const slotGrid = document.querySelector("#slot-grid");
    const bookingDialog = document.querySelector("#booking-dialog");
    const bookingForm = document.querySelector("#booking-form");
    const guestNameInput = document.querySelector("#guest-name");
    const formError = document.querySelector("#form-error");
    let selectedHour = null;

    function localDateString(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function storageKey(date) {
      return `hourbook-bookings:${date}`;
    }

    function readBookings(date) {
      try {
        return JSON.parse(localStorage.getItem(storageKey(date)) || "{}");
      } catch {
        return {};
      }
    }

    function formatHour(hour) {
      return `${String(hour).padStart(2, "0")}:00`;
    }

    function renderSlots() {
      const date = dateInput.value;
      const bookings = readBookings(date);
      const booked = Object.keys(bookings).length;
      document.querySelector("#day-label").textContent = new Date(`${date}T12:00:00`).toLocaleDateString(undefined, {
        weekday: "long", month: "long", day: "numeric", year: "numeric"
      });
      document.querySelector("#available-count").textContent = `${24 - booked} available`;
      document.querySelector("#booked-count").textContent = `${booked} booked`;
      slotGrid.replaceChildren();

      for (let hour = 0; hour < 24; hour += 1) {
        const existingBooking = bookings[String(hour)];
        const slot = document.createElement(existingBooking ? "div" : "button");
        slot.className = existingBooking ? "slot booked-slot" : "slot";
        if (!existingBooking) {
          slot.type = "button";
          slot.setAttribute("aria-label", `${formatHour(hour)} to ${formatHour(hour + 1)}, available. Book this slot`);
        }
        const time = document.createElement("span");
        time.className = "slot-time";
        time.textContent = `${formatHour(hour)} – ${formatHour((hour + 1) % 24)}`;
        const state = document.createElement("span");
        state.className = "slot-state";
        state.textContent = existingBooking ? `Booked · ${existingBooking.name}` : "Available · 1 hour";
        slot.append(time, state);
        if (existingBooking) {
          const cancelButton = document.createElement("button");
          cancelButton.type = "button";
          cancelButton.className = "cancel-booking";
          cancelButton.textContent = "Cancel booking";
          cancelButton.setAttribute("aria-label", `Cancel booking for ${formatHour(hour)} to ${formatHour(hour + 1)}`);
          cancelButton.addEventListener("click", () => cancelBooking(hour));
          slot.append(cancelButton);
        } else {
          slot.addEventListener("click", () => openBooking(hour));
        }
        slotGrid.append(slot);
      }
    }

    function cancelBooking(hour) {
      const bookings = readBookings(dateInput.value);
      const booking = bookings[String(hour)];
      if (!booking || !window.confirm(`Cancel the ${formatHour(hour)} booking for ${booking.name}?`)) return;

      delete bookings[String(hour)];
      localStorage.setItem(storageKey(dateInput.value), JSON.stringify(bookings));
      renderSlots();
    }

    function openBooking(hour) {
      selectedHour = hour;
      const date = new Date(`${dateInput.value}T12:00:00`).toLocaleDateString(undefined, {
        weekday: "long", month: "long", day: "numeric"
      });
      document.querySelector("#dialog-slot").textContent = `${date} · ${formatHour(hour)} to ${formatHour((hour + 1) % 24)}`;
      formError.textContent = "";
      guestNameInput.value = "";
      bookingDialog.showModal();
      guestNameInput.focus();
    }

    dateInput.value = localDateString(new Date());
    document.querySelector("#timezone").textContent = `Local time · ${Intl.DateTimeFormat().resolvedOptions().timeZone}`;
    dateInput.addEventListener("change", renderSlots);
    document.querySelector("#close-dialog").addEventListener("click", () => bookingDialog.close());
    bookingDialog.addEventListener("click", event => {
      if (event.target === bookingDialog) bookingDialog.close();
    });
    bookingForm.addEventListener("submit", event => {
      event.preventDefault();
      const name = guestNameInput.value.trim();
      if (!name || selectedHour === null) return;

      const bookings = readBookings(dateInput.value);
      const hourKey = String(selectedHour);
      if (bookings[hourKey]) {
        formError.textContent = "That slot was just booked. Please choose another hour.";
        bookingDialog.close();
        renderSlots();
        return;
      }

      bookings[hourKey] = { name, createdAt: new Date().toISOString() };
      localStorage.setItem(storageKey(dateInput.value), JSON.stringify(bookings));
      bookingDialog.close();
      renderSlots();
    });

    renderSlots();
  </script>
</body>
</html>
